name: Security & Quality Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  security:
    name: Dependency & Code Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: ESLint security lint
        run: npx eslint script-*.js --ext .js
        continue-on-error: false

      - name: Validate env-var JSON shape
        run: node .github/scripts/validate-env.js
        continue-on-error: false

      - name: TypeScript type-check (API + frontend)
        run: npx tsc --noEmit -p tsconfig.json && npx tsc --noEmit -p tsconfig.frontend.json
        continue-on-error: false

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
