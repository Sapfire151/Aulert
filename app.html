<body>
<div id="scrollBar"></div>
<div id="auroraFollower"></div>
<div class="aurora">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- APP -->

  <!-- Top Nav -->
  <nav class="app-nav">
    <div class="nav-logo">Aulert</div>
    <div class="nav-tabs">
      <button class="nav-tab on" id="tb-feed" onclick="bellRingAnim(this);goTab('feed',this)">
        <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Notifications</span>
        <span class="tab-badge" id="badge-feed"></span>
      </button>
      <button class="nav-tab" id="tb-cal" onclick="calFlipAnim(this);goTab('cal',this)">
        <svg class="nav-icon" id="cal-svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <!-- body -->
          <rect class="cal-body" x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
          <!-- header bar fill -->
          <rect class="cal-header" x="3" y="4" width="18" height="6" rx="2" fill="currentColor" opacity="0.15"/>
          <!-- ring pins -->
          <path class="cal-rings" d="M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <!-- divider line -->
          <path class="cal-line" d="M3 10h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <!-- date number "7" -->
          <text class="cal-num" x="12" y="20" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" font-family="inherit">7</text>

        </svg>
        <span>Calendar</span>
        <span class="tab-badge" id="badge-cal"></span>
      </button>
      <button class="nav-tab" id="tb-hw" onclick="hwCheckAnim(this);goTab('hw',this)">
        <svg class="nav-icon" id="hw-svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <!-- clipboard body -->
          <path class="hw-board" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- clip tab -->
          <rect class="hw-clip" x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
          <!-- line 1 (fades out on click) -->
          <path class="hw-line1" d="M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <!-- line 2 (fades out on click) -->
          <path class="hw-line2" d="M9 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <!-- checkmark drawn directly on the note, no circle -->
          <path class="hw-check-draw" d="M8 13.5l2.5 2.5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20" stroke-dashoffset="20" opacity="0"/>
        </svg>
        <span>Homework</span>
        <span class="tab-badge" id="badge-hw"></span>
      </button>

      <button class="nav-tab" id="tb-set" onclick="gearSpinAnim(this);goTab('set',this)">
        <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Settings</span>
      </button>
      <button class="nav-tab" id="tb-fbk" onclick="fbkPopAnim(this);goTab('fbk',this)">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <!-- bubble body -->
          <path class="fbk-body" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- three typing dots -->
          <circle class="fbk-dot fbk-dot-1" cx="8"  cy="12" r="1.3" fill="currentColor" opacity="0.9"/>
          <circle class="fbk-dot fbk-dot-2" cx="12" cy="12" r="1.3" fill="currentColor" opacity="0.9"/>
          <circle class="fbk-dot fbk-dot-3" cx="16" cy="12" r="1.3" fill="currentColor" opacity="0.9"/>

        </svg>
        <span>Feedbacks</span>
      </button>
    </div>
    <div class="nav-r">
      <!-- Theme toggle (in-nav) -->
      <div class="icon-btn icon-btn-animate" id="navThemeBtn" onclick="iconPop(this);toggleTheme()" title="Toggle theme">
        <svg id="navThemeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon-btn icon-btn-animate" id="bellBtn" onclick="iconPop(this);bellRingAnim(this);toggleNotifPanel(event)" title="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div class="notif-pip" id="pip" style="display:none"></div>
      </div>
      <!-- User -->
      <div class="user-pill icon-btn-animate" onclick="iconPop(this);goTab('set',document.getElementById('tb-set'))">
        <div class="ava">S</div>
        <span class="user-pill-name">Student</span>
      </div>
    </div>
  </nav>

  <!-- ── NOTIFICATION PANEL ── -->
  <div class="notif-panel-overlay" id="notifPanelOverlay" onclick="closeNotifPanel()"></div>
  <div class="notif-panel" id="notifPanel">
    <div class="np-header">
      <div class="np-title">
        Notifications
        <span id="npUnreadCount">0</span>
      </div>
      <div class="np-actions">
        <button class="np-mark-all" onclick="markAllRead()">Mark all read</button>
        <div class="np-close-btn" onclick="closeNotifPanel()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>
    </div>
    <div class="np-list" id="npList"></div>
    <div class="np-footer">
      <button class="np-view-all icon-btn-animate" onclick="iconPop(this);closeNotifPanel();goTab('feed',document.getElementById('tb-feed'))">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        View all in feed
      </button>
    </div>
  </div>

  <div class="app-body" id="appBody"></div>

      <!-- Sheet (detail) -->
<div class="sheet-veil" id="sheetVeil" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-top">
      <div class="sheet-eyebrow" id="shEyebrow"></div>
      <div class="sheet-h" id="shTitle"></div>
      <div class="sheet-sub" id="shSub"></div>
    </div>
    <div class="sheet-content">
      <div class="sheet-body-text" id="shText"></div>
      <div class="sheet-actions">
        <a href="https://classroom.google.com" target="_blank" class="sa-primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="15,3 21,3 21,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="14" x2="21" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Open in Classroom
        </a>
        <button class="sa-ghost" id="mrBtn" onclick="toggleRead()">Mark as read</button>
        <button class="sa-ghost" onclick="closeSheet()">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Push toast -->
<div class="push-toast" id="toast">
  <div class="toast-icon">
    <svg class="icon-teal" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="var(--gamemaster)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="var(--gamemaster)" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="toast-body">
    <div class="toast-app">Aulert · Google Classroom</div>
    <div class="toast-t" id="toastT">New notification</div>
    <div class="toast-m" id="toastM">You have a new classroom update</div>
  </div>
  <div class="toast-close" onclick="closeToast()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="snack" id="snack">Setting saved ✓</div>


<!-- Advanced Theme Switcher -->
<button class="theme-switcher-btn hidden" id="globalThemeBtn" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
    <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<!-- ════ Trust & Safety UI ════ -->
<div class="ts-rate-banner" id="tsRateBanner">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span id="tsRateBannerText">Slow down</span>
</div>
