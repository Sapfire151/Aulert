# SonarQube project configuration for Aulert
# https://docs.sonarqube.org/latest/analysis/

# Project identification
sonar.projectKey=aulert
sonar.projectName=Aulert
sonar.projectVersion=1.0.0

# Sources - point to TypeScript source files and API code
sonar.sources=src,api,scripts

# Exclusions - exclude compiled JavaScript files that duplicate TypeScript source,
# node_modules, and the built icon bundle
sonar.exclusions=**/node_modules/**,**/script-*.js,morphicon-icons.js

# Java settings (if applicable)
sonar.java.binaries=

# Reporting
sonar.reporting.branch=name