    <div class="panel" id="p-hw">
      <div class="hw-wrap">
        <div class="hw-header">
          <div>
            <h1 class="hw-title" data-i18n="hw_title">Homework</h1>
            <p class="hw-sub" data-i18n="hw_sub">Track tasks, export as PDF, share with anyone.</p>
          </div>
          <div class="hw-header-actions">
            <button class="hw-btn hw-btn-export" onclick="hwExportPDF()" title="Export as PDF">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span data-i18n="hw_export_btn">Export PDF</span>
            </button>

          </div>
        </div>

        <!-- Add task form -->
        <div class="hw-form">
          <div class="hw-form-row">
            <label for="hwSubject" class="sr-only">Subject</label>
            <input class="hw-input hw-input-subject" id="hwSubject"
              placeholder="Subject (e.g. Math, Biology)"
              data-i18n="hw_subject" maxlength="80"
              oninput="hwAutoSuggestPriority(this.value)" />
            <!-- Custom Date+Time Picker Trigger -->
            <div class="hwdtp-wrap" id="hwDtpWrap">
              <button type="button" class="hwdtp-trigger hw-input" id="hwDtpTrigger" onclick="hwDtpToggle()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;opacity:.6">
                  <rect x="3" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="hwDtpLabel" data-i18n="hw_pick_dl">Pick deadline…</span>
              </button>
              <button type="button" id="hwDtpClear" class="hwdtp-clear-btn" onclick="hwDtpClear(event)" aria-label="Clear deadline" title="Clear deadline" style="display:none;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
              <!-- Hidden value holder -->
              <input type="hidden" id="hwDate"/>
              <!-- Dropdown panel -->
              <div class="hwdtp-panel" id="hwDtpPanel">
                <!-- Calendar section -->
                <div class="hwdtp-cal">
                  <div class="hwdtp-nav">
                    <button type="button" class="hwdtp-nav-btn" onclick="hwDtpShiftMonth(-1)" aria-label="Previous month">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="hwdtp-month-lbl" id="hwDtpMonthLbl"></span>
                      <button type="button" class="hwdtp-today-btn" id="hwDtpTodayBtn" onclick="hwDtpGoToday()" style="display:none;">Today</button>
                    </div>
                    <button type="button" class="hwdtp-nav-btn" onclick="hwDtpShiftMonth(1)" aria-label="Next month">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                  </div>
                  <div class="hwdtp-dow-row">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                  </div>
                  <div class="hwdtp-days" id="hwDtpDays"></div>
                </div>
                <!-- Divider -->
                <div class="hwdtp-divider"></div>
                <!-- Time section -->
                <div class="hwdtp-time-section">
                  <div class="hwdtp-time-lbl">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    Time
                  </div>
                  <div class="hwdtp-time-row">
                    <div class="hwdtp-time-col">
                      <button type="button" class="hwdtp-arr" onclick="hwDtpShiftHour(1)" aria-label="Increase hour">▲</button>
                      <input class="hwdtp-time-val" id="hwDtpHourVal" type="text" inputmode="numeric" maxlength="2" value="23"
                        onfocus="this.select()"
                        oninput="hwDtpHourInput(this)"
                        onblur="hwDtpHourBlur(this)"
                        onkeydown="hwDtpTimeKey(event,'hour')"/>
                      <button type="button" class="hwdtp-arr" onclick="hwDtpShiftHour(-1)" aria-label="Decrease hour">▼</button>
                    </div>
                    <span class="hwdtp-colon">:</span>
                    <div class="hwdtp-time-col">
                      <button type="button" class="hwdtp-arr" onclick="hwDtpShiftMin(5)" aria-label="Increase minutes">▲</button>
                      <input class="hwdtp-time-val" id="hwDtpMinVal" type="text" inputmode="numeric" maxlength="2" value="59"
                        onfocus="this.select()"
                        oninput="hwDtpMinInput(this)"
                        onblur="hwDtpMinBlur(this)"
                        onkeydown="hwDtpTimeKey(event,'min')"/>
                      <button type="button" class="hwdtp-arr" onclick="hwDtpShiftMin(-5)" aria-label="Decrease minutes">▼</button>
                    </div>
                  </div>
                </div>
                <!-- Footer -->
                <div class="hwdtp-footer">
                  <button type="button" class="hwdtp-done-btn" onclick="document.querySelectorAll('.hwdtp-day.selected,.hwdtp-day.day-flash').forEach(el=>el.classList.remove('selected','day-flash'));hwDtpConfirm()">Set Deadline</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Priority + Tags row -->
          <div class="hw-form-row hw-meta-row">
            <!-- Custom priority pill group -->
            <div class="hw-priority-group" role="group" aria-label="Task priority">
              <span class="hw-priority-label">Priority:</span>
              <button type="button" class="hw-priority-btn priority-normal active" data-priority="normal" onclick="hwSelectPriority('normal',this)" aria-pressed="true">Normal</button>
              <button type="button" class="hw-priority-btn priority-low" data-priority="low" onclick="hwSelectPriority('low',this)" aria-pressed="false">Low</button>
              <button type="button" class="hw-priority-btn priority-high" data-priority="high" onclick="hwSelectPriority('high',this)" aria-pressed="false">High</button>
              <button type="button" class="hw-priority-btn priority-urgent" data-priority="urgent" onclick="hwSelectPriority('urgent',this)" aria-pressed="false">🚨 Urgent</button>
              <input type="hidden" id="hwPriority" value="normal" />
            </div>
            <!-- Tags -->
            <label for="hwTags" class="sr-only">Tags</label>
            <input class="hw-input hw-tags-input" id="hwTags" placeholder="Tags (comma separated)" maxlength="60" aria-label="Tags" />
          </div>

          <label for="hwDesc" class="sr-only">Description</label>
          <textarea class="hw-textarea" id="hwDesc" placeholder="Description — what needs to be done?" data-i18n="hw_desc" rows="3"></textarea>
          <div class="hw-form-footer">
            <span class="hw-form-hint">Date &amp; time optional — pick your exact deadline</span>
            <button class="hw-btn hw-btn-add" onclick="hwAdd()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
              <span data-i18n="hw_add_btn">Add Task</span>
            </button>
          </div>
        </div>

        <!-- Filter and Sort Controls -->
        <div class="hw-controls-row">
          <div class="hw-filter-bar" id="hwFilterBar"></div>
          <div class="hw-dropdown-wrap" id="hwSortDropdown">
            <button type="button" class="hw-dropdown-trigger" id="hwSortTrigger" onclick="hwToggleSortDropdown(event)" aria-haspopup="listbox" aria-expanded="false">
              <svg class="hw-dropdown-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="7" y1="12" x2="17" y2="12"/>
                <line x1="10" y1="18" x2="14" y2="18"/>
              </svg>
              <span id="hwSortLabel">Priority → Due Date</span>
              <svg class="hw-dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="hw-dropdown-menu" id="hwSortMenu" role="listbox" aria-labelledby="hwSortTrigger">
              <button type="button" class="hw-dropdown-item active" data-value="priority-due" onclick="hwSelectSortMode('priority-due', 'Priority → Due Date')" role="option" aria-selected="true">
                <span class="hw-dropdown-item-text">Priority → Due Date</span>
                <svg class="hw-dropdown-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button type="button" class="hw-dropdown-item" data-value="due-priority" onclick="hwSelectSortMode('due-priority', 'Due Date → Priority')" role="option" aria-selected="false">
                <span class="hw-dropdown-item-text">Due Date → Priority</span>
                <svg class="hw-dropdown-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
            <input type="hidden" id="hwSortSelect" value="priority-due" />
          </div>
        </div>

        <!-- Task list -->
        <div class="hw-list" id="hwList">
          <div class="hw-empty" id="hwEmpty">
            <svg class="hw-empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <p data-i18n="hw_empty_sub">No tasks yet — add one above</p>
          </div>
        </div>
      </div>
    </div>
